name: Straight Jacket

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ensure package version is unpublished
        if: github.event_name == 'pull_request'
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "::error::${package_name}@${package_version} is already published. Bump the package version before merging to main."
            exit 1
          fi
      - run: npm install -g .
      - run: straight-jacket verify --trusted-public-key-fingerprint "$STRAIGHT_JACKET_PUBLIC_KEY_FINGERPRINT" --json
        env:
          STRAIGHT_JACKET_PUBLIC_KEY_FINGERPRINT: ${{ vars.STRAIGHT_JACKET_PUBLIC_KEY_FINGERPRINT }}
