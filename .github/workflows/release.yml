name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - id: release
        name: Resolve release version
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          tag_name="v${package_version}"
          tag_sha="$(git rev-list -n 1 "${tag_name}" 2>/dev/null || true)"

          {
            echo "package_name=${package_name}"
            echo "package_version=${package_version}"
            echo "tag_name=${tag_name}"
            echo "tag_sha=${tag_sha}"
          } >> "$GITHUB_OUTPUT"

          if [ -n "${tag_sha}" ] && [ "${tag_sha}" != "${GITHUB_SHA}" ]; then
            echo "::error::${tag_name} already exists at ${tag_sha}, not ${GITHUB_SHA}."
            exit 1
          fi

          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "npm_published=true" >> "$GITHUB_OUTPUT"
            if [ -z "${tag_sha}" ]; then
              echo "::error::${package_name}@${package_version} is already published, but ${tag_name} is missing locally. Resolve manually to avoid tagging code that may not match the package."
              exit 1
            fi
          else
            echo "npm_published=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      - run: npm test
      - run: npm run guardrails
      - run: node bin/straight-jacket.mjs verify --trusted-public-key-fingerprint "$STRAIGHT_JACKET_PUBLIC_KEY_FINGERPRINT" --json
        env:
          STRAIGHT_JACKET_PUBLIC_KEY_FINGERPRINT: ${{ vars.STRAIGHT_JACKET_PUBLIC_KEY_FINGERPRINT }}
      - name: Publish npm package
        if: steps.release.outputs.npm_published == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Push release tag
        if: steps.release.outputs.tag_sha == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.release.outputs.tag_name }}" "${GITHUB_SHA}"
          git push origin "${{ steps.release.outputs.tag_name }}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.release.outputs.tag_name }}" >/dev/null 2>&1 || \
            gh release create "${{ steps.release.outputs.tag_name }}" \
              --title "${{ steps.release.outputs.tag_name }}" \
              --generate-notes \
              --latest \
              --target "${GITHUB_SHA}"
